name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinicflow
          POSTGRES_PASSWORD: clinicflow
          POSTGRES_DB: clinicflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicflow -d clinicflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://clinicflow:clinicflow@localhost:5432/clinicflow_test
      CORS_ORIGIN: http://localhost:5173
      ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-characters

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run migrate:up
      - run: npm test

  front:
    name: Front
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, front]

    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          POSTGRES_PASSWORD: ci
          ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
          REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-characters
          ADMIN_PASSWORD: ci-admin-password
